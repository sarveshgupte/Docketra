product:
  name: "Docketra — The Company Brain for Indian Firms"
  description: "Dedicated practice operations platform for Indian CS, CA, and legal compliance firms. Connects directly to the firm's private Google Drive (restricted drive.file scope) with turnkey statutory checklists, 1-click client drop links, and partner maker-checker approval controls."
  pricing: "Free Sandbox (₹0 forever up to 5 clients). Starter: ₹1,499/mo (₹12,990/yr Pioneer 30 pass). Growth: ₹21,990/yr flat for up to 12 seats."
  key_benefits:
    - "100% Google Drive Data Sovereignty: Client working papers live in your firm's own Drive under restricted drive.file scope."
    - "Zero Client Login Friction: Clients drag-and-drop bank statements and bills via 1-click links without registering or creating passwords."
    - "Turnover Defense for Article Clerks: Pre-loaded checklists for Companies Act, GST, and Form 3CD ensure Day-1 trainee productivity."
    - "Partner Review Oversight: 4-eye verification before government portal filing with timestamped logs for ICAI/ICSI peer reviews."
    - "30-Day Money-Back Guarantee: 100% refund if not satisfied; all organized files remain in your Drive."
  objection_responses:
    "Can you read our confidential client tax returns in Google Drive?": "No. Docketra operates under restricted Google drive.file permissions and only accesses the specific folder it created. We cannot read or search any existing files in your Drive."
    "Our clients refuse to open web links or log into portals.": "Your clients never have to register or create accounts. They use a 1-click drop link, or continue texting files on WhatsApp while your staff drop media directly into the docket."
    "Our article clerks leave every 2-3 years, we don't have time to train them.": "Docketra requires zero training days. It ships with pre-loaded statutory checklists for MCA, GST, and Form 3CD that junior trainees follow step-by-step from Day 1."
    "What if we decide to cancel our subscription?": "You own 100% of your data. Because all documents and folders are created inside your own Google Drive, you keep every file and organized folder forever without export fees."
    "We already track everything fine on Excel.": "Most firms do until filing season hits or a clerk leaves. Docketra prevents missed MCA late fees (₹100/day penalty) and eliminates hours spent hunting for attachments in WhatsApp threads."

