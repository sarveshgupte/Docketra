name: Continuous Deployment (CUG)

on:
  push:
    branches:
      - cug

concurrency:
  group: cd-cug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend-cug:
    name: Build and Deploy Frontend to Firebase (CUG)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build React Frontend for CUG
        run: |
          cd ui
          npm ci
          npm exec playwright install chromium
          VITE_API_BASE_URL="https://docketra-api-cug-1078507569854.us-central1.run.app/api" \
          VITE_GOOGLE_CLIENT_ID="1078507569854-c24hg50jkar8p68ooumkdebr3qtrcoe5.apps.googleusercontent.com" \
          VITE_SUPPORT_EMAIL="sarveshgupte@gmail.com" \
          VITE_TURNSTILE_SITE_KEY="0x4AAAAAADUM0lvwvSX_G56o" \
          npm run build
          cd ..

      - name: Deploy Frontend to Firebase Hosting (CUG)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCKETRA_PROD }}"
          target: cug
          channelId: live
          projectId: docketra-prod

  deploy-backend-cug:
    name: Build and Deploy Backend to Cloud Run (CUG)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy Backend to Cloud Run (CUG)
        run: |
          IMAGE_URI="gcr.io/docketra-prod/docketra-api-cug:${{ github.sha }}"
          gcloud builds submit --project docketra-prod --tag "$IMAGE_URI" --suppress-logs .
          gcloud run deploy docketra-api-cug \
            --project docketra-prod \
            --region us-central1 \
            --image "$IMAGE_URI" \
            --platform managed \
            --allow-unauthenticated
